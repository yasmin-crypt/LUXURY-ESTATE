<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Properties | Luxury Estate</title>
    <style>
        :root { --navy: #0A192F; --gold: #C5A059; --cream: #F8F9FA; --text: #333; }
        body { font-family: 'Segoe UI', sans-serif; background-color: var(--cream); margin: 0; }
        
        nav { padding: 20px 80px; background: var(--navy); display: flex; justify-content: space-between; align-items: center; }
        .logo { color: var(--gold); font-size: 24px; font-weight: bold; }
        .nav-links a { color: white; text-decoration: none; margin-left: 20px; }

        .content { padding: 40px 80px; }
        .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(350px, 1fr)); gap: 30px; }
        .card { background: white; border-radius: 12px; overflow: hidden; box-shadow: 0 4px 15px rgba(0,0,0,0.1); cursor: pointer; transition: 0.3s; }
        .card:hover { transform: translateY(-10px); }
        .card img { width: 100%; height: 220px; object-fit: cover; }
        .card-body { padding: 20px; }
        .price { color: var(--gold); font-weight: bold; font-size: 1.2rem; }

        /* Modal Styles */
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); z-index: 100; justify-content: center; align-items: center; padding: 20px; overflow-y: auto; }
        .modal-content { background: white; width: 1000px; max-width: 100%; border-radius: 12px; position: relative; padding: 40px; }
        
        .modal-body { display: grid; grid-template-columns: 1.5fr 1fr; gap: 40px; margin-bottom: 40px; }
        .close-btn { position: absolute; top: 20px; right: 20px; cursor: pointer; font-size: 30px; }
        
        /* Fixed Gallery */
        .gallery { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 20px; width: 100%; }
        .gallery img { width: 100%; height: 150px; object-fit: cover; border-radius: 8px; display: block; }
        .gallery img.main { grid-column: span 2; height: 300px; }
        
        .price-box { background: var(--cream); padding: 25px; border-radius: 12px; position: sticky; top: 0; height: fit-content; }
        
        .contact-section { border-top: 1px solid #eee; padding-top: 40px; }
        .form-group { margin-bottom: 20px; }
        label { display: block; margin-bottom: 8px; font-weight: bold; color: var(--navy); }
        input, textarea { width: 100%; padding: 12px; border: 1px solid #ddd; border-radius: 6px; box-sizing: border-box; }
        .submit-btn { background: var(--navy); color: white; border: none; padding: 15px 30px; border-radius: 6px; cursor: pointer; font-weight: bold; width: 100%; }
        
        .enquire-btn { background: var(--navy); color: white; border: none; padding: 12px; width: 100%; border-radius: 6px; cursor: pointer; font-weight: bold; transition: 0.3s; margin-bottom: 10px; }
        .back-btn { background: transparent; color: var(--navy); border: 1px solid var(--navy); padding: 12px; width: 100%; border-radius: 6px; cursor: pointer; font-weight: bold; }
        
        .feature-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 15px; }
        .feature-item { background: #f0f0f0; padding: 8px; border-radius: 4px; font-size: 0.9rem; }
    </style>
</head>
<body>
    <nav>
        <div class="logo">LUXURY ESTATE</div>
        <div class="nav-links">
            <a href="index.html">Home</a>
            <a href="properties.html">Properties</a>
        </div>
    </nav>

    <div class="content">
        <h1>Exclusive Properties</h1>
        <div class="grid" id="properties-grid">
            <!-- Property 1 -->
            <div class="card" onclick="openModal('Bavarian Forest Chalet', 'E£ 41.3M', '3 Bedrooms', '175 m²', 'Private sauna, Forest location, Mountain views, Fireplace, Spa', 'A breathtaking wellness chalet nestled in the heart of the Bavarian Forest.', 'https://images.unsplash.com/photo-1613490493576-7fde63acd811', 'https://images.unsplash.com/photo-1518780664697-55e3ad937233', 'https://images.unsplash.com/photo-1502672260266-1c1ef2d93688')">
                <img src="https://images.unsplash.com/photo-1613490493576-7fde63acd811">
                <div class="card-body"><h3>Bavarian Forest Chalet</h3><span class="price">E£ 41.3M</span></div>
            </div>
            <!-- Property 2 -->
            <div class="card" onclick="openModal('Golden Harbor Penthouse', 'E£ 25.5M', '4 Bedrooms', '220 m²', 'Sea view, Private elevator, Infinity pool, Gym, Sauna', 'Luxury living at its finest with panoramic harbor views.', 'https://images.unsplash.com/photo-1600585154340-be6161a56a0c', 'https://images.unsplash.com/photo-1600596542815-ffad4c1539a9', 'https://images.unsplash.com/photo-1600607687939-ce8a6c25118c')">
                <img src="https://images.unsplash.com/photo-1600585154340-be6161a56a0c">
                <div class="card-body"><h3>Golden Harbor Penthouse</h3><span class="price">E£ 25.5M</span></div>
            </div>
             <!-- Property 3 -->
            <div class="card" onclick="openModal('Coastal Serenity Villa', 'E£ 55.0M', '5 Bedrooms', '400 m²', 'Beach access, Large garden, Home theater, Wine cellar', 'Escape to this tranquil coastal retreat with private beach access.', 'https://images.unsplash.com/photo-1449844908441-8829872d2607', 'https://images.unsplash.com/photo-1512917774080-9991f1c4c750', 'https://images.unsplash.com/photo-1613977257363-707ba9348227')">
                <img src="https://images.unsplash.com/photo-1449844908441-8829872d2607">
                <div class="card-body"><h3>Coastal Serenity Villa</h3><span class="price">E£ 55.0M</span></div>
            </div>
        </div>
    </div>

    <div id="modal" class="modal" onclick="closeModal()">
        <div class="modal-content" onclick="event.stopPropagation()">
            <span class="close-btn" onclick="closeModal()">&times;</span>
            
            <div class="modal-body">
                <div class="details-left">
                    <div class="gallery" id="m-gallery"></div>
                    <h2 id="m-title">Title</h2>
                    <p id="m-desc" style="color:#666; line-height:1.6;"></p>
                    <div id="m-features"></div>
                </div>
                <div class="price-box">
                    <h3 id="m-price" style="font-size: 1.5rem; color:var(--gold);">Price</h3>
                    <p id="m-specs"></p>
                    <button class="enquire-btn" onclick="scrollToForm()">Enquire Now</button>
                    <button class="back-btn" onclick="closeModal()">Back</button>
                </div>
            </div>

            <div class="contact-section" id="contact-form">
                <h2>Contact us about this property</h2>
                <p>Get in touch today to schedule a viewing or discuss next steps.</p>
                <div class="form-group"><label>Name</label><input type="text" placeholder="Your Name"></div>
                <div style="display:grid; grid-template-columns:1fr 1fr; gap:20px;">
                    <div class="form-group"><label>Phone Number</label><input type="tel"></div>
                    <div class="form-group"><label>Email</label><input type="email"></div>
                </div>
                <div class="form-group"><label>Message</label><textarea id="m-msg" rows="5"></textarea></div>
                <button class="submit-btn" onclick="alert('Message Sent!')">Send Message</button>
            </div>
        </div>
    </div>

    <script>
        function openModal(title, price, beds, size, features, desc, img1, img2, img3) {
            document.getElementById('m-title').innerText = title;
            document.getElementById('m-price').innerText = price;
            document.getElementById('m-specs').innerText = `${beds} | ${size}`;
            document.getElementById('m-desc').innerText = desc;
            
            // الصور
            document.getElementById('m-gallery').innerHTML = `<img src="${img1}" class="main"><img src="${img2}"><img src="${img3}">`;
            
            // المميزات
            const fGrid = document.createElement('div');
            fGrid.className = 'feature-grid';
            features.split(', ').forEach(f => {
                fGrid.innerHTML += `<div class="feature-item">${f}</div>`;
            });
            const featContainer = document.getElementById('m-features');
            featContainer.innerHTML = '<h3>Features</h3>';
            featContainer.appendChild(fGrid);

            // الرسالة التلقائية
            document.getElementById('m-msg').value = `Hi,\n\nI'm interested in "${title}".\n\nPlease get in touch with more details.\n\nThanks`;
            
            document.getElementById('modal').style.display = 'flex';
        }

        function closeModal() { document.getElementById('modal').style.display = 'none'; }
        
        function scrollToForm() {
            document.getElementById('contact-form').scrollIntoView({ behavior: 'smooth' });
        }
    </script>
</body>
</html>
