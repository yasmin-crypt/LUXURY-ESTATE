<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Welcome to Luxury Estate</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body, html { margin: 0; padding: 0; height: 100%; overflow: hidden; background-color: #0A192F; }
        
        .container-main { display: flex; width: 100%; height: 100vh; position: relative; }
        
        .panel { 
            flex: 1; 
            transition: all 0.8s cubic-bezier(0.165, 0.84, 0.44, 1);
            filter: grayscale(40%);
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            cursor: pointer;
            overflow: hidden;
            background-size: cover;
            background-position: center;
        }
        
        .panel:hover { flex: 2; filter: grayscale(0%); }
        
        @keyframes slideDown {
            from { transform: translateY(-100%); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }
        @keyframes slideUp {
            from { transform: translateY(100%); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }

        /* تم زيادة المدة إلى 5 ثوانٍ لجعل الحركة أبطأ وأكثر فخامة */
        .animate-down { animation: slideDown 5s cubic-bezier(0.22, 1, 0.36, 1) forwards; }
        .animate-up { animation: slideUp 5s cubic-bezier(0.22, 1, 0.36, 1) forwards; }
    </style>
</head>
<body>

    <div id="container" class="container-main">
        <div class="panel animate-down" style="background-image: url('https://images.unsplash.com/photo-1600585154340-be6161a56a0c')" onclick="enterSite()"></div>
        <div class="panel animate-up" style="background-image: url('https://images.unsplash.com/photo-1613490493576-7fde63acd811')" onclick="enterSite()"></div>
        <div class="panel animate-down" style="background-image: url('https://images.unsplash.com/photo-1449844908441-8829872d2607')" onclick="enterSite()"></div>
        <div class="panel animate-up" style="background-image: url('https://images.unsplash.com/photo-1512917774080-9991f1c4c750')" onclick="enterSite()"></div>
        <div class="panel animate-down" style="background-image: url('https://images.unsplash.com/photo-1502672260266-1c1ef2d93688')" onclick="enterSite()"></div>
    </div>

    <div class="absolute inset-0 flex items-center justify-center pointer-events-none z-10">
        <div class="text-white text-center">
            <h1 class="text-5xl md:text-8xl font-bold tracking-tighter drop-shadow-2xl">LUXURY ESTATE</h1>
            <p class="text-xl mt-4 opacity-80 uppercase tracking-[0.3em] animate-pulse">Click anywhere to enter</p>
        </div>
    </div>

    <script>
        function enterSite() {
            document.getElementById('container').style.transition = 'opacity 0.8s';
            document.getElementById('container').style.opacity = '0';
            
            setTimeout(() => {
                window.location.href = 'home.html';
            }, 800);
        }
    </script>
</body>
</html>
